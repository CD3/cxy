[project]
name = "cxy"
version = "0.1.0"
description = "A cargo-like project tool for C++, built on Conan, CMake and Ninja"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "clifton.clark@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clang-format>=18",
    "cmake>=3.24",
    "conan>=2.4,<3",
    "cyclopts>=5.5,<6",
    "gersemi>=0.19",
    "ninja>=1.11",
    "ruff>=0.4",
    "tomlkit>=0.13,<1",
]

[project.scripts]
cxy = "cxy.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ty>=0.0.109",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: runs the real Conan, CMake and compiler (slow, needs network)"]

[tool.poe.tasks.test]
help = "Run the unit tests"
cmd = "pytest"

[tool.poe.tasks.lint]
help = "Run the linter"
cmd = "ruff check"

[tool.poe.tasks.format-check]
help = "Check the formatting"
cmd = "ruff format --check"

[tool.poe.tasks.typecheck]
help = "Run the type checker"
cmd = "ty check"

[tool.poe.tasks.check]
help = "Run the linter, formatting check, type checker and unit tests"
sequence = ["lint", "format-check", "typecheck", "test"]
ignore_fail = "return_non_zero"  # Run them all, even if one fails.
