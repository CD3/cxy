[project]
name = "cxy"
version = "0.1.0"
description = "A cargo-like project tool for C++, built on Conan, CMake and Ninja"
readme = "README.md"
authors = [
    { email = "clifton.clark@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cmake>=3.24",
    "conan>=2.4,<3",
    "cyclopts>=5.5,<6",
    "ninja>=1.11",
]

[project.scripts]
cxy = "cxy.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: runs the real Conan, CMake and compiler (slow, needs network)"]
