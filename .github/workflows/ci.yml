name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false # Report on every platform.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install
        run: uv sync --locked

      - name: Check
        run: uv run poe check

      - name: End-to-end tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: uv run poe test -m e2e --durations=0

      # Ninja needs the Visual C++ environment to find the compiler.
      - name: End-to-end tests (Visual C++)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: cmd
        run: |
          set "vswhere=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%vswhere%" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          uv run poe test -m e2e --durations=0
